  <text x="295" y="29"
        font-family="Orbitron, sans-serif"
        font-size="26" font-weight="900"
        fill="white" opacity="0.35">/</text>
  <text x="318" y="29"
        font-family="Orbitron, sans-serif"
        font-size="26" font-weight="900"
        letter-spacing="3"
        fill="white" opacity="0.6">blog</text>
</svg>
