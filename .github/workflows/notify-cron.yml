name: Hourly Push Notification

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'   # UTC 2:30 → Korea (UTC+9) 11:30 lunch time
    - cron: '30 5 * * *'   # UTC 5:30 → covers UTC-4:00 to UTC-0:00 users at local 11:30
    - cron: '30 7 * * *'   # UTC 7:30 → Korea 16:30 (TEST)
    - cron: '30 8 * * *'   # UTC 8:30 → covers UTC-1:00 to UTC+3:00 users at local 11:30
    - cron: '30 11 * * *'  # UTC 11:30 → covers UTC+4:00 to UTC+8:00 users at local 11:30
    - cron: '30 14 * * *'  # UTC 14:30 → covers UTC+7:00 to UTC+11:00 users at local 11:30
    - cron: '30 17 * * *'  # UTC 17:30 → covers UTC+10:00 to UTC+14:00 users at local 11:30
    - cron: '30 20 * * *'  # UTC 20:30 → covers UTC+13:00 to UTC+17:00 users at local 11:30
    - cron: '30 23 * * *'  # UTC 23:30 → covers UTC+16:00 to UTC+20:00 users at local 11:30

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Send Notifications
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$IS_MANUAL" = "true" ]; then
            node scripts/notify.js --test
          else
            node scripts/notify.js
          fi
