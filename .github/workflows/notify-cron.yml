name: Daily Push Notification (local 17:30)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'   # UTC 8:30 → Korea (UTC+9) 17:30 evening
    - cron: '30 11 * * *'  # UTC 11:30 → UTC+6 users at local 17:30
    - cron: '30 14 * * *'  # UTC 14:30 → UTC+3 users at local 17:30
    - cron: '30 17 * * *'  # UTC 17:30 → UTC+0 users at local 17:30
    - cron: '30 20 * * *'  # UTC 20:30 → UTC-3 users at local 17:30
    - cron: '30 23 * * *'  # UTC 23:30 → UTC-6 users at local 17:30
    - cron: '30 2 * * *'   # UTC 2:30 → UTC-9 users at local 17:30
    - cron: '30 5 * * *'   # UTC 5:30 → UTC+12 users at local 17:30

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Send Notifications
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$IS_MANUAL" = "true" ]; then
            node scripts/notify.js --test
          else
            node scripts/notify.js
          fi
