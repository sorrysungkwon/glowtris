name: Vercel Deployment Status

# Reports Vercel build progress as a GitHub Commit Status (not a Deployment record).
# Commit Status is a separate API from Deployments — no conflict with the Vercel
# GitHub App, no duplicate deployment records, no rate-limit issues.
#
# Shows up on each commit as:   ● Vercel / Preview — Building… → Deployed ✓
#
# ⚠️  API calls use the STABLE TEAM ID (not the slug) so they survive team renames.
#     Team ID: team_pb1objuXoHlJIv67jumHZrg8 (never changes)
#     Project ID: prj_V1lhSONnxAM9K2hpk5VLtemldWnm (never changes)
#
# Prerequisites — add this repo secret (Settings → Secrets → Actions):
#   VERCEL_TOKEN : Vercel personal access token (vercel.com → Account Settings → Tokens)

on:
  push:
    branches: [preview, master]

permissions:
  statuses: write   # commit status only — no deployments created

jobs:
  track:
    name: Vercel status
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      # ── 1. Mark commit as "pending" immediately ───────────────────────────
      - name: Set status — pending
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const env = context.ref === 'refs/heads/master' ? 'Production' : 'Preview';
            await github.rest.repos.createCommitStatus({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              sha:         context.sha,
              state:       'pending',
              context:     `Vercel / ${env}`,
              description: 'Building on Vercel…',
              target_url:  'https://vercel.com/sgkwon-team/glowtris',
            });

      # ── 2. Poll Vercel until the deployment for this commit is done ─────────
      - name: Poll Vercel deployment
        id: poll
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          COMMIT_SHA:   ${{ github.sha }}
          # Use stable IDs — these never change even if the team/project is renamed
          VERCEL_TEAM_ID:    team_pb1objuXoHlJIv67jumHZrg8
          VERCEL_PROJECT_ID: prj_V1lhSONnxAM9K2hpk5VLtemldWnm
          # Workflow start time (ms) — deployments created before this are from a previous push
          STARTED_AT: ${{ github.run_id }}
        run: |
          set -euo pipefail
          DEPLOY_URL=""
          FINAL_STATE="error"
          START_MS=$(date +%s%3N)

          echo "Waiting for Vercel to pick up ${COMMIT_SHA:0:12}…"

          # Look for the most recent deployment created after this workflow started.
          # Vercel's GitHub integration does not always populate meta.githubCommitSha,
          # so we match by timing: the deployment created closest after our push.
          DEPLOY_ID=""
          for i in $(seq 1 18); do
            sleep 10
            RESP=$(curl -sf \
              "https://api.vercel.com/v6/deployments?limit=5&teamId=${VERCEL_TEAM_ID}&projectId=${VERCEL_PROJECT_ID}" \
              -H "Authorization: Bearer $VERCEL_TOKEN" 2>/dev/null || echo '{"deployments":[]}')

            # Try SHA match first (works when Vercel GitHub App populates meta)
            DEPLOY_ID=$(echo "$RESP" | python3 -c "
import sys, json
data = json.load(sys.stdin)
sha = '${COMMIT_SHA}'[:12]
for d in data.get('deployments', []):
    m = d.get('meta', {})
    commit = m.get('githubCommitSha', '') or m.get('gitSha', '')
    if commit.startswith(sha):
        print(d['uid']); sys.exit(0)
" 2>/dev/null)

            # Fallback: pick the newest deployment created after workflow start
            if [ -z "$DEPLOY_ID" ]; then
              DEPLOY_ID=$(echo "$RESP" | python3 -c "
import sys, json
data = json.load(sys.stdin)
start = $START_MS
for d in data.get('deployments', []):
    created = d.get('createdAt', 0)
    if created >= start - 60000:
        print(d['uid']); sys.exit(0)
" 2>/dev/null)
            fi

            [ -n "$DEPLOY_ID" ] && { echo "Found: $DEPLOY_ID (attempt $i)"; break; }
            echo "  Not found yet (attempt $i)…"
          done

          if [ -z "$DEPLOY_ID" ]; then
            echo "final_state=error" >> "$GITHUB_OUTPUT"
            echo "deploy_url="       >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Poll until READY / ERROR / CANCELED (up to ~5 min)
          for i in $(seq 1 60); do
            sleep 5
            DDATA=$(curl -sf \
              "https://api.vercel.com/v13/deployments/${DEPLOY_ID}?teamId=${VERCEL_TEAM_ID}" \
              -H "Authorization: Bearer $VERCEL_TOKEN" 2>/dev/null || echo '{}')
            READY=$(echo "$DDATA" | jq -r '.readyState // ""')
            echo "  [$i] $READY"
            case "$READY" in
              READY)
                DEPLOY_URL=$(echo "$DDATA" | jq -r '"https://"+.url' 2>/dev/null)
                FINAL_STATE="success"; break ;;
              ERROR)    FINAL_STATE="failure";  break ;;
              CANCELED) FINAL_STATE="error";    break ;;
            esac
          done

          echo "final_state=$FINAL_STATE" >> "$GITHUB_OUTPUT"
          echo "deploy_url=$DEPLOY_URL"   >> "$GITHUB_OUTPUT"
          echo "deploy_id=$DEPLOY_ID"     >> "$GITHUB_OUTPUT"

      # ── 3. Assign prevglow.vercel.app alias (preview branch only) ───────────
      - name: Assign prevglow alias
        if: github.ref == 'refs/heads/preview' && steps.poll.outputs.final_state == 'success' && steps.poll.outputs.deploy_id != ''
        env:
          VERCEL_TOKEN:   ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_pb1objuXoHlJIv67jumHZrg8
          DEPLOY_ID:      ${{ steps.poll.outputs.deploy_id }}
        run: |
          curl -sf -X POST \
            "https://api.vercel.com/v2/deployments/${DEPLOY_ID}/aliases?teamId=${VERCEL_TEAM_ID}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"alias":"prevglow.vercel.app"}' \
            && echo "✓ prevglow.vercel.app → $DEPLOY_ID" \
            || echo "⚠ alias assignment failed (non-blocking)"

      # ── 4. Update commit status with final result ─────────────────────────
      - name: Set status — final
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const env   = context.ref === 'refs/heads/master' ? 'Production' : 'Preview';
            const state = '${{ steps.poll.outputs.final_state }}' || 'error';
            const url   = '${{ steps.poll.outputs.deploy_url }}';
            const desc  = {
              success: 'Deployed ✓',
              failure: 'Build failed',
              error:   'Could not verify deployment',
            }[state] ?? state;

            await github.rest.repos.createCommitStatus({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              sha:        context.sha,
              state,
              context:    `Vercel / ${env}`,
              description: desc,
              target_url: url || 'https://vercel.com/sgkwon-team/glowtris',
            });
