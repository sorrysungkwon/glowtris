<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glowtris Target UI Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap');

  :root {
    --bg: #00000a;
    --surface: rgba(4, 4, 18, 0.6);
    --outline: rgba(0, 200, 255, 0.25);
    --cyan: #00c8ff;
    --pink: #ff007f;
    --r-xl: 16px;
    --type-label-l: 12px;
  }

  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    /* Fake space background */
    background-image: radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                      radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.1) 0%, transparent 40%);
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--r-xl);
    padding: 20px;
    width: 220px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 
      0 0 25px rgba(0, 200, 255, 0.08), 
      inset 0 0 15px rgba(0, 0, 40, 0.4),
      0 4px 30px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .panel-title {
    font-family: 'Orbitron', sans-serif;
    font-size: var(--type-label-l);
    font-weight: 700;
    letter-spacing: 2px;
    color: rgba(0, 200, 255, 0.7);
    text-shadow: 0 0 8px rgba(0, 200, 255, 0.3);
    text-align: center;
  }

  .score-val {
    font-family: 'Orbitron', monospace;
    font-size: 28px;
    font-weight: 900;
    text-align: center;
    color: #fff;
    text-shadow: 0 0 10px rgba(0, 200, 255, 0.8), 0 0 20px rgba(0, 200, 255, 0.4);
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 200, 255, 0.3), transparent);
  }

  /* Target Overtake Specific CSS */
  .target-box {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 230, 0, 0.3);
    border-radius: 12px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 20px rgba(255, 230, 0, 0.05);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .target-header {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #ffe600;
    text-shadow: 0 0 8px rgba(255, 230, 0, 0.5);
    letter-spacing: 1px;
  }

  .target-content {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .target-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .target-user {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.9);
  }

  .target-score {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 230, 0, 0.6);
    line-height: 1;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan), #ffe600);
    border-radius: 3px;
    box-shadow: 0 0 10px #ffe600;
    transition: width 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Overtake animation */
  @keyframes shatter {
    0% { transform: scale(1); filter: brightness(1); }
    15% { transform: scale(1.15); filter: brightness(3); box-shadow: 0 0 50px #ffe600, 0 0 20px #fff; border-color: #fff; }
    35% { transform: scale(0.95); filter: brightness(1.5); box-shadow: 0 0 20px #ffe600; }
    100% { transform: scale(1); filter: brightness(1); }
  }

  .overtaken {
    animation: shatter 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* Target change animation */
  @keyframes slideOutUp {
    to { transform: translateY(-20px); opacity: 0; }
  }
  @keyframes slideInUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .slide-out { animation: slideOutUp 0.3s forwards; }
  .slide-in { animation: slideInUp 0.3s forwards; }
</style>
</head>
<body>

<div class="panel">
  <!-- Existing Score -->
  <div>
    <div class="panel-title">SCORE</div>
    <div class="score-val" id="my-score">112,050</div>
  </div>

  <div class="divider"></div>

  <!-- New Target Overtake UI -->
  <div class="target-box" id="target-box">
    <div class="target-header" id="target-title">🎯 NEXT TARGET</div>
    
    <div class="target-content" id="target-content">
      <div class="target-row">
        <div class="target-user">
          <span style="opacity:0.5">👤</span>
          <span id="target-name">NeoBrain</span>
        </div>
        <div class="target-score" id="target-score">124,500</div>
      </div>
      
      <div class="progress-track">
        <div class="progress-fill" id="target-progress"></div>
      </div>
    </div>
  </div>
</div>

<script>
  let currentScore = 112050;
  let targetScore = 124500;
  
  const progressFill = document.getElementById('target-progress');
  const myScoreDisplay = document.getElementById('my-score');
  const targetBox = document.getElementById('target-box');
  const targetName = document.getElementById('target-name');
  const targetScoreDisplay = document.getElementById('target-score');
  const targetContent = document.getElementById('target-content');
  const targetTitle = document.getElementById('target-title');

  let targets = [
    { name: "TetrisGod99", score: 185000 },
    { name: "BlockMaster", score: 250000 },
    { name: "GlowKing", score: 400000 }
  ];
  let targetIndex = 0;
  let isAnimating = false;

  setInterval(() => {
    if (targetIndex >= targets.length || isAnimating) return;
    
    // Simulate score increasing
    currentScore += Math.floor(Math.random() * 800) + 200;
    
    // Update Score UI
    myScoreDisplay.innerText = currentScore.toLocaleString();
    
    // Update Progress
    const currentTargetScore = targetScore;
    const percent = Math.min((currentScore / currentTargetScore) * 100, 100);
    progressFill.style.width = percent + '%';
    
    // Trigger Overtake Event (Protected by isAnimating lock)
    if (currentScore >= currentTargetScore) {
      isAnimating = true;
      targetBox.classList.add('overtaken');
      targetTitle.innerText = "OVERTAKEN!";
      targetTitle.style.color = "#fff";
      
      // Wait for shatter animation (0.3s), then start slide out
      setTimeout(() => {
        targetContent.classList.add('slide-out');
        targetBox.classList.remove('overtaken');
        
        // Wait for slide out to finish (0.3s)
        setTimeout(() => {
          targetTitle.innerText = "🎯 NEXT TARGET";
          targetTitle.style.color = "#ffe600";
          
          targetContent.classList.remove('slide-out');
          targetContent.classList.add('slide-in');
          
          const nextTarget = targets[targetIndex];
          targetName.innerText = nextTarget.name;
          targetScoreDisplay.innerText = nextTarget.score.toLocaleString();
          targetScore = nextTarget.score;
          targetIndex++;
          
          // Reset the progress bar visually instantly without transition
          progressFill.style.transition = 'none';
          progressFill.style.width = ((currentScore / nextTarget.score) * 100) + '%';
          
          // Restore transition
          setTimeout(() => {
            progressFill.style.transition = 'width 0.15s cubic-bezier(0.34, 1.56, 0.64, 1)';
          }, 50);

          // Remove slide-in class and unlock after animation finishes
          setTimeout(() => {
            targetContent.classList.remove('slide-in');
            isAnimating = false; // Unlock here
          }, 300);
          
        }, 300);
      }, 400); // 0.4s to let shatter settle
    }
  }, 100);
</script>

</body>
</html>
